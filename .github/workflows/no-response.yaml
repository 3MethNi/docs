    # ยกเว้นปัญหาทั้งหมดกับผู้รับมอบหมายจากการถูกทำเครื่องหมายว่าไม่เกี่ยวข้อง ยกเลิกตัวเลือก "ยกเว้นผู้รับมอบหมายทั้งหมด" ที่เกี่ยวข้องกับปัญหาเท่านั้น
    ยกเว้นผู้รับมอบหมายปัญหาทั้งหมด: # ตัวเลือก ค่าเริ่มต้นคือ
