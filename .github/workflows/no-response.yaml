    ป้ายที่จะเพิ่มเมื่อไม่เก่า: # ตัวเลือก ค่าเริ่มต้นคือ
    # รายการป้ายกำกับที่คั่นด้วยจุลภาคที่ต้องการลบออกเมื่อปัญหาหรือคำขอดึงข้อมูลกลายเป็นข้อมูลเก่า
    ป้ายที่ต้องลบออกเมื่อหมดอายุ: # ตัวเลือก ค่าเริ่มต้นคือ
