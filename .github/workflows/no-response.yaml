    ยกเว้นผู้รับมอบหมายทั้งหมด: # ตัวเลือก ค่าเริ่มต้นคือ
    # ยกเว้นคำขอแบบร่างที่ถูกทำเครื่องหมายว่าล้าสมัย ค่าเริ่มต้นคือเท็จ
